# Check the links in the Markdown files a PR adds or changes, so text-only PRs get a real green/red check.
# docs/ is left to the MkDocs strict build where a repo has one.
name: links

on:
  pull_request:

permissions:
  contents: read

jobs:
  links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install lychee 0.24.2
        run: |
          curl -sSfL -o lychee.tgz https://github.com/lycheeverse/lychee/releases/download/lychee-v0.24.2/lychee-x86_64-unknown-linux-gnu.tar.gz
          echo "1f4e0ef7f6554a6ed33dd7ac144fb2e1bbed98598e7af973042fc5cd43951c9a  lychee.tgz" | sha256sum -c -
          tar xzf lychee.tgz

      - name: Check links in changed Markdown files
        env:
          BASE: ${{ github.base_ref }}
        # 429 = rate limited, 999 = LinkedIn refusing bots: neither means the link is dead.
        # ponytail: links to the owner's private repos are skipped (the check runs logged out and would see 404);
        # add a repo here when it turns private, or pass a token with read access to all of them.
        run: |
          git diff -z --name-only --diff-filter=AM "origin/$BASE...HEAD" -- '*.md' ':!docs/**' > changed
          if [ ! -s changed ]; then echo "No Markdown files changed outside docs/."; exit 0; fi
          xargs -0 ./lychee-x86_64-unknown-linux-gnu/lychee --no-progress --max-retries 3 \
            --accept '200..=299,429,999' \
            --exclude '^https://github\.com/YuHsunWang/(Downloads|Family_mart|agents-institution|code|disposition-stock-study|kb-index|knowledge-base|my-slide|project_dashboard|research|sql-workbench-archive|trading_strategy)([/#?]|$)' \
            < changed
